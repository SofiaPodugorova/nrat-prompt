[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrat-prompt"
version = "0.2.0"
description = "Fetch and validate NRAT OK metadata for one page or one day"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5"]

[project.scripts]
nrat-page = "nrat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
