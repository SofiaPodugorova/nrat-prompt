[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrat-prompt"
version = "0.3.0"
description = "Collect NRAT OK metadata and PDFs with resumable yearly reports"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "beautifulsoup4>=4.12,<5"]

[project.scripts]
nrat-page = "nrat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
